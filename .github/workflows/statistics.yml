name: Statistical domain
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/statistics-foundation-v1, feat/statistics-engine-v1]
jobs:
  validate-statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint src/lib/statistics scripts/statistics tests/statistics
      - run: npm run stats:typecheck
      - run: npm run stats:validate
      - run: npm run stats:test
      - run: node --test tests/*.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
